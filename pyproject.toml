[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynpzd"
version = "0.4.0"
description = "A Python NPZD model based on EMPOWER"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "NPZD Model Developer"}
]
keywords = ["oceanography", "marine-ecosystem", "npzd", "modeling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "tomli>=1.2.0",
    "numba",
    "xarray",
    "pydap",
    "netCDF4",
    "jinja2",
    "copernicusmarine>=2.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
]

[project.scripts]
pynpzd = "pynpzd.model:main"

[tool.pytest.ini_options]
markers = [
    "empower: comparisons against the published EMPOWER-1.0 R implementation",
    "slow: five-year simulation comparisons",
]

[tool.hatch.build.targets.wheel]
packages = ["pynpzd"]

[tool.hatch.build.targets.sdist]
include = [
    "*.py",
    "*.toml",
    "*.txt",
    "*.csv",
    "*.md",
    "LICENSE",
]
